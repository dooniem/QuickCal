<!doctype html>
<html lang="no">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QuickCal beta</title>
  <meta name="description" content="Quick ISO week calendar with Norwegian holidays and vacations">
  <meta name="theme-color" content="#143275">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="../icons/favicon.png">
  <link rel="apple-touch-icon" href="../icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
  <!-- Installed app: the window gets its size at once, and the QuickCal icon shows until the app is ready -->
  <style>#splash { display: none; } html.starting #splash { display: flex; position: fixed; inset: 0; z-index: 99; align-items: center; justify-content: center; background: #fff; } #splash img { width: 72px; height: 72px; }</style>
  <script>
    (function () {
      try {
        if (!(matchMedia('(display-mode: standalone)').matches || matchMedia('(display-mode: window-controls-overlay)').matches)) return;
        document.documentElement.classList.add('starting');
        window.addEventListener('load', function () { document.documentElement.classList.remove('starting'); });
        var s = JSON.parse(localStorage.getItem('quickcal-beta.settings') || '{}');
        if (s.appMaximized) return;
        var z = s.appSize || { w: 600, h: 220 };
        var w = Math.max(300, Math.min(z.w, screen.availWidth)), h = Math.max(110, Math.min(z.h, screen.availHeight));
        window.resizeTo(w + (window.outerWidth - window.innerWidth), h + (window.outerHeight - window.innerHeight));
      } catch (e) { /* the app sizes the window again when it starts */ }
    })();
  </script>
</head>
<body>
  <div id="splash"><img src="../icons/icon-192.png" alt=""></div>
  <div id="stage">
    <div id="scaler">

      <!-- ===================== 3-MONTH VIEW ===================== -->
      <section id="monthView" class="page" data-w="600" data-h="220">
        <div class="months3">
          <div class="month" id="m1"></div>
          <div class="month" id="m2"></div>
          <div class="month" id="m3"></div>
        </div>
        <div class="bottomRow three">
          <div class="fitLeft wide"><span id="infoText" class="smallInfo"></span></div>
          <div class="right"><button class="linkBox notesBtn" id="notesBtn1"><svg class="gear" viewBox="0 0 24 24"><path d="M6 3.5h9l3.5 3.5v13.5H6z" fill="#fff8c4" stroke="currentColor" stroke-width="1.5"/><path d="M8.8 10h7M8.8 13.5h7M8.8 17h4.5" stroke="currentColor" stroke-width="1.4"/></svg></button><button class="linkBox pipBtn hidden" id="pipBtn1"><svg class="gear" viewBox="0 0 24 24"><path d="M9 3.5h6l-1 5 3 3v1.5H7V11.5l3-3z" fill="#e8e8e8" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><path d="M12 13v7.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button><button class="linkBox" id="settingsBtn1"><span class="t-settings"></span> <svg class="gear" viewBox="0 0 24 24"><path d="M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7Zm9 4.6v-2.2l-2.3-.5a7 7 0 0 0-.7-1.6l1.3-2-1.6-1.6-2 1.3a7 7 0 0 0-1.6-.7L13.6 3h-2.2l-.5 2.3a7 7 0 0 0-1.6.7l-2-1.3-1.6 1.6 1.3 2a7 7 0 0 0-.7 1.6L4 10.4v2.2l2.3.5c.2.6.4 1.1.7 1.6l-1.3 2 1.6 1.6 2-1.3c.5.3 1 .5 1.6.7l.5 2.3h2.2l.5-2.3c.6-.2 1.1-.4 1.6-.7l2 1.3 1.6-1.6-1.3-2c.3-.5.5-1 .7-1.6l2.3-.5Z" fill="none" stroke="currentColor" stroke-width="1.4"/></svg></button></div>
          <div class="tagline">QuickCal beta - Magnus Petersen</div>
        </div>
      </section>

      <!-- ===================== YEAR VIEW (maximized window) ===================== -->
      <section id="yearView" class="page hidden" data-w="1024" data-h="680">
        <div class="yearBar">
          <button class="navBtn" id="yearBack" aria-label="Previous year"><svg viewBox="0 0 24 24"><path d="M20 12H5m6-7-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.4"/></svg></button>
          <div id="yearTitle">2026</div>
          <button class="navBtn" id="yearForward" aria-label="Next year"><svg viewBox="0 0 24 24"><path d="M4 12h15m-6-7 7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.4"/></svg></button>
        </div>
        <div class="yearGrid" id="yearGrid"></div>
        <div class="bottomRow three">
          <div class="fitLeft"><span id="yearInfoText" class="smallInfo"></span></div>
          <div class="right"><button class="linkBox notesBtn" id="notesBtn2"><svg class="gear" viewBox="0 0 24 24"><path d="M6 3.5h9l3.5 3.5v13.5H6z" fill="#fff8c4" stroke="currentColor" stroke-width="1.5"/><path d="M8.8 10h7M8.8 13.5h7M8.8 17h4.5" stroke="currentColor" stroke-width="1.4"/></svg></button><button class="linkBox" id="settingsBtn2"><span class="t-settings"></span> <svg class="gear" viewBox="0 0 24 24"><path d="M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7Zm9 4.6v-2.2l-2.3-.5a7 7 0 0 0-.7-1.6l1.3-2-1.6-1.6-2 1.3a7 7 0 0 0-1.6-.7L13.6 3h-2.2l-.5 2.3a7 7 0 0 0-1.6.7l-2-1.3-1.6 1.6 1.3 2a7 7 0 0 0-.7 1.6L4 10.4v2.2l2.3.5c.2.6.4 1.1.7 1.6l-1.3 2 1.6 1.6 2-1.3c.5.3 1 .5 1.6.7l.5 2.3h2.2l.5-2.3c.6-.2 1.1-.4 1.6-.7l2 1.3 1.6-1.6-1.3-2c.3-.5.5-1 .7-1.6l2.3-.5Z" fill="none" stroke="currentColor" stroke-width="1.4"/></svg></button></div>
          <div class="tagline">QuickCal beta - Magnus Petersen</div>
        </div>
      </section>

      <!-- ===================== SETTINGS ===================== -->
      <section id="settingsPage" class="page hidden textPage" data-w="600" data-h="220">
        <h1 id="settingsTitle"></h1>
        <button class="btn topRight" id="welcomeBtn"></button>
        <div class="setRow">
          <label id="languageLabel" for="languageSelect"></label>
          <select id="languageSelect">
            <option value="English">English</option>
            <option value="Norwegian">Norsk</option>
            <option value="UseSystemLanguage" id="systemLanguageOption"></option>
          </select>
        </div>
        <div class="setRow"><span id="notesLabel"></span><button class="check" id="notesCheck"></button></div>
        <div class="setRow"><span id="holidaysLabel"></span><button class="check" id="holidaysCheck"></button></div>
        <div class="setRow dependsOnHolidays"><span id="easterLabel"></span><button class="check" id="easterCheck"></button></div>
        <div class="setRow dependsOnHolidays">
          <span id="weeksBefore"></span>
          <input id="weeksInput" type="text" inputmode="numeric" maxlength="1">
          <span id="weeksAfter"></span>
        </div>
        <button class="btn back" id="settingsBack" aria-label="Back"><svg viewBox="0 0 24 24"><path d="M20 12H5m6-7-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.2"/></svg></button>
        <div class="stackBottomRight">
          <button class="btn" id="installPageBtn"></button>
          <button class="btn" id="autostartPageBtn"></button>
          <button class="btn hidden" id="resetSizeBtn"></button>
        </div>
      </section>

      <!-- ===================== NOTES ===================== -->
      <section id="notesPage" class="page hidden textPage" data-w="600" data-h="220">
        <h1 id="notesTitle"></h1>
        <button class="btn topRight" id="notesDeleteAll"></button>
        <div class="notesTools hidden" id="notesTools">
          <label class="notesSearch"><svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6" fill="none" stroke="currentColor" stroke-width="2"/><path d="m15 15 5.5 5.5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg><input id="notesSearch" type="search" autocomplete="off" spellcheck="false"></label>
          <button class="notesFilterBtn" id="notesFilterBtn"><svg viewBox="0 0 24 24"><path d="M3.5 5h17l-6.5 7.5v6l-4 2v-8z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg><span class="nfCount"></span></button>
          <div class="notesFilterMenu hidden" id="notesFilterMenu"></div>
          <button class="notesFilterBtn" id="notesColorsBtn"><svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 0 18c1.2 0 1.8-.8 1.8-1.7 0-1-.9-1.4-.9-2.4 0-1 .8-1.7 1.8-1.7H17a4 4 0 0 0 4-4C21 6.6 17 3 12 3z" fill="none" stroke="currentColor" stroke-width="1.7"/><circle cx="7.5" cy="11" r="1.6" fill="#7b1e2b"/><circle cx="10" cy="7" r="1.6" fill="#e8871e"/><circle cx="14.5" cy="7" r="1.6" fill="#2e9e5b"/><circle cx="17" cy="10.5" r="1.6" fill="#8e44ad"/></svg></button>
          <div class="notesFilterMenu notesColorsMenu hidden" id="notesColorsMenu"></div>
          <button class="notesFilterBtn notesPicsBtn" id="notesPicsBtn"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.7"/><polygon class="npHill" points="4.5,17.5 10,11 13.5,15 15.5,13 19.5,17.5"/><circle class="npSun" cx="16" cy="9" r="1.8"/><line class="npSlash" x1="3" y1="21" x2="21" y2="3" stroke-width="2.2" stroke-linecap="round"/></svg></button>
          <button class="notesFilterBtn notesCalBtn" id="notesCalBtn"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.7"/><line x1="3.5" y1="9.5" x2="20.5" y2="9.5" stroke="currentColor" stroke-width="1.7"/><line x1="8" y1="3" x2="8" y2="6.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><line x1="16" y1="3" x2="16" y2="6.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><rect class="ncDay" x="7" y="12.5" width="4" height="4" rx=".5"/><rect class="ncDay2" x="13" y="12.5" width="4" height="4" rx=".5"/></svg></button>
        </div>
        <p id="notesEmpty"></p>
        <p id="notesInstallInfo" class="notesInstallInfo"></p>
        <button class="btn inline hidden" id="notesInstallBtn"></button>
        <div id="notesList" class="notesList"></div>
        <button class="btn exportBtn hidden" id="notesExport"><svg viewBox="0 0 24 24"><rect x="7" y="2" width="15" height="20" rx="3" fill="#185c37"/><path d="M10 2h5v9.5H7V5a3 3 0 0 1 3-3z" fill="#4fa463"/><path d="M15 2h4a3 3 0 0 1 3 3v4.5h-7z" fill="#b5e09f"/><path d="M15 9.5h7v6h-7z" fill="#2f8f4e"/><path d="M7 11.5h8V22h-5a3 3 0 0 1-3-3z" fill="#21734a"/><rect x="1.5" y="7.5" width="11.5" height="11.5" rx="2" fill="#107c41"/><path d="m4.6 10.4 5.3 5.7m0-5.7-5.3 5.7" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg></button>
        <button class="btn exportBtn backupBtn hidden" id="notesBackup"><svg viewBox="0 0 24 24"><path d="M4 14v5.5h16V14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M12 3.5v11m-4.5-4.5 4.5 4.5 4.5-4.5" fill="none" stroke="#143275" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <button class="btn exportBtn restoreBtn hidden" id="notesRestore"><svg viewBox="0 0 24 24"><path d="M4 14v5.5h16V14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M12 15V4m-4.5 4.5L12 4l4.5 4.5" fill="none" stroke="#2e9e5b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <p class="backupHint hidden" id="notesBackupHint"></p>
        <input type="file" id="notesRestoreFile" accept=".json,application/json" hidden>
        <button class="btn back" id="notesBack" aria-label="Back"><svg viewBox="0 0 24 24"><path d="M20 12H5m6-7-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.2"/></svg></button>
      </section>

      <!-- ===================== INSTALL AS APP ===================== -->
      <section id="installPage" class="page hidden textPage" data-w="600" data-h="220">
        <h1 id="installTitle"></h1>
        <p id="installIntro"></p>
        <ol id="installSteps"></ol>
        <button class="btn inline" id="installNowBtn"></button>
        <p class="tip" id="installTip"></p>
        <button class="btn back subBack" aria-label="Back"><svg viewBox="0 0 24 24"><path d="M20 12H5m6-7-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.2"/></svg></button>
      </section>

      <!-- ===================== AUTOSTART ===================== -->
      <section id="autostartPage" class="page hidden textPage" data-w="600" data-h="220">
        <h1 id="autostartTitle"></h1>
        <p id="autostartIntro"></p>
        <ol id="autostartSteps"></ol>
        <button class="btn inline" id="copyAppsBtn"></button>
        <p class="tip" id="autostartTip"></p>
        <button class="btn back subBack" aria-label="Back"><svg viewBox="0 0 24 24"><path d="M20 12H5m6-7-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.2"/></svg></button>
      </section>

      <!-- ===================== JUST INSTALLED (first start as an app) ===================== -->
      <section id="installedPage" class="page hidden textPage" data-w="600" data-h="220">
        <h1 id="installedTitle"></h1>
        <p id="installedIntro"></p>
        <ol id="installedSteps"></ol>
        <p class="tip" id="installedTip"></p>
        <button class="btn okBtn" id="installedOk">OK</button>
      </section>

      <!-- ===================== GETTING STARTED (first run) ===================== -->
      <section id="welcomePage" class="page hidden textPage" data-w="600" data-h="220">
        <h1 id="welcomeTitle"></h1>
        <div class="wRow">
          <svg class="wIcon" viewBox="0 0 24 24"><path d="M12 3v12m-5-5 5 5 5-5M4 20h16" fill="none" stroke="#143275" stroke-width="2"/></svg>
          <span class="wText" id="wInstallText"></span>
          <button class="btn wBtn" id="wInstallBtn"></button>
        </div>
        <div class="wRow">
          <span class="miniWeek" id="wWeekIcon">41</span>
          <span class="wText" id="wBadgeText"></span>
        </div>
        <div class="wRow">
          <svg class="wIcon" viewBox="0 0 24 24"><path d="M12 3v9m-6.4-5.4a8 8 0 1 0 12.8 0" fill="none" stroke="#143275" stroke-width="2"/></svg>
          <span class="wText" id="wAutostartText"></span>
          <button class="btn wBtn" id="wAutostartBtn"></button>
        </div>
        <div class="wRow tipRow">
          <svg class="wIcon" viewBox="0 0 24 24"><path d="M9 18h6m-5 3h4M12 3a6 6 0 0 0-3.5 10.9V16h7v-2.1A6 6 0 0 0 12 3Z" fill="none" stroke="#C08000" stroke-width="1.8"/></svg>
          <span class="wTip" id="wTip"></span>
        </div>
        <button class="btn okBtn" id="welcomeOk">OK</button>
      </section>

    </div>
  </div>

  <div id="menu" class="menu hidden"></div>
  <div id="tooltip" class="tooltip hidden"></div>

  <script src="pip.js"></script>
  <script src="xlsx.js"></script>
  <script src="notes.js"></script>
  <script src="app.js"></script>
</body>
</html>
